name: build-exe
on: [push, workflow_dispatch]
jobs:
  win:
    runs-on: windows-latest
    defaults: {run: {shell: msys2 {0}}}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2
      - run: g++ -O2 -std=c++17 skyline_fpv.cpp -o skyline.exe $(sdl2-config --cflags) -static -static-libgcc -static-libstdc++ $(sdl2-config --static-libs) -lopengl32
      - uses: actions/upload-artifact@v4
        with: {name: skyline-exe, path: skyline.exe}
